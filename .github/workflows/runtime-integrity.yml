name: Runtime integrity

# Abort superseded PR runs of this workflow (never cancel scheduled/main runs).
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
on:
  push:
    branches: [main, audit-hardening]
    paths:
      - 'api/telemetry.js'
      - 'src/settlement-core.js'
      - 'src/settlement-app-persistence.js'
      - 'tests/runtime-integrity.test.mjs'
      - 'qa/save-safety-regression.cjs'
      - '.github/workflows/runtime-integrity.yml'
  pull_request:
permissions:
  contents: read
jobs:
  integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Runtime syntax
        run: |
          for file in src/*.js api/*.js; do node --check "$file"; done
      - name: Local diagnostics and disabled remote telemetry
        run: node --test tests/runtime-integrity.test.mjs
      - name: Preserve saves and DEV-only resource floor
        run: node qa/save-safety-regression.cjs
