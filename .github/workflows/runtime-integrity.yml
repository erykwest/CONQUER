name: Runtime integrity

# Abort superseded PR runs of this workflow (never cancel scheduled/main runs).
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
on:
  push:
    branches: [main]
    paths:
      - 'api/telemetry.js'
      - 'src/settlement-core.js'
      - 'src/settlement-app-persistence.js'
      - 'src/settlement-save-snapshot.js'
      - 'src/ui/save-status.js'
      - 'tools/runtime-contract.cjs'
      - 'tests/extended-save.test.mjs'
      - 'tests/resource-ui.test.mjs'
      - 'tests/runtime-integrity.test.mjs'
      - 'src/codex-catalog.js'
      - 'src/settlement-codex.js'
      - 'qa/codex-catalog-regression.cjs'
      - 'qa/save-safety-regression.cjs'
      - 'qa/construction-priority-regression.cjs'
      - '.github/workflows/runtime-integrity.yml'
  pull_request:
permissions:
  contents: read
jobs:
  integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Runtime syntax (src/**/*.js, src/**/*.mjs, api/*.js)
        shell: bash
        run: |
          # ES-module .js files (export/import without a package.json "type") are
          # re-checked as .mjs so the result does not depend on Node's syntax detection.
          failed=0
          count=0
          while IFS= read -r -d '' file; do
            count=$((count + 1))
            if node --check "$file" 2>"$RUNNER_TEMP/check.err"; then continue; fi
            if [[ "$file" == *.js ]] && grep -Eq '^[[:space:]]*(import|export)' "$file"; then
              cp "$file" "$RUNNER_TEMP/esm-check.mjs"
              if node --check "$RUNNER_TEMP/esm-check.mjs" 2>"$RUNNER_TEMP/check.err"; then continue; fi
            fi
            cat "$RUNNER_TEMP/check.err" >&2
            echo "::error file=$file::syntax check failed"
            failed=1
          done < <({ find src -type f \( -name '*.js' -o -name '*.mjs' \) -print0; find api -maxdepth 1 -type f -name '*.js' -print0; } | sort -z)
          echo "Syntax-checked $count files"
          test "$count" -gt 0
          exit "$failed"
      - name: Runtime module wiring
        run: node tools/runtime-contract.cjs
      - name: Local diagnostics and disabled remote telemetry
        run: node --test tests/runtime-integrity.test.mjs tests/hardening.test.mjs tests/extended-save.test.mjs tests/resource-ui.test.mjs
      - name: Autumn foliage calendar and renderer regression
        run: node qa/autumn-foliage-regression.cjs
      - name: Tree and bush bark colour regression
        run: node qa/tree-bark-regression.cjs
      - name: Staged construction and priorities
        run: |
          node qa/construction-priority-regression.cjs
          node qa/construction-materials-regression.cjs
          node qa/upgrades-dev-regression.cjs
      - name: Stone colour palette and semantic rendering regression
        run: node qa/stonecolor-regression.cjs
      - name: Preserve saves and DEV-only resource floor
        run: node qa/save-safety-regression.cjs

      - name: Codex catalog and live gameplay providers
        run: node qa/codex-catalog-regression.cjs

      - name: Wiki links and fresh generated catalog
        run: |
          node qa/codex-wiki-regression.cjs
          node tools/export-codex.cjs --check

      - name: Obsidian editorial approval and fresh export
        run: |
          node qa/codex-obsidian-regression.cjs
          node qa/codex-vault-import-regression.cjs
          node tools/export-codex-content.cjs --check
