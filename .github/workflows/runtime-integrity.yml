name: Runtime integrity
on:
  push:
    branches: [main, audit-hardening]
  pull_request:

jobs:
  integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check
        run: |
          for file in src/*.js api/*.js; do node --check "$file"; done
      - name: Security and persistence regression tests
        run: node --test tests/*.test.mjs
