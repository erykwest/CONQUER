name: Work animation regression

# Abort superseded PR runs of this workflow (never cancel scheduled/main runs).
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
on:
  pull_request:
    branches: [main]
    paths:
      - 'src/settlement-work-anim.js'
      - 'src/settlement-industries.js'
      - 'src/settlement-population-figures.js'
      - 'src/settlement-render.js'
      - 'src/settlement-shop-cutaway.js'
      - 'qa/work-anim-regression.cjs'
      - '.github/workflows/work-anim-regression.yml'
  workflow_dispatch:
jobs:
  work-anim:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Check animation source and test syntax
        run: |
          node --check src/settlement-work-anim.js
          node --check src/settlement-industries.js
          node --check src/settlement-population-figures.js
          node --check qa/work-anim-regression.cjs
      - name: Run work-animation regression
        run: node qa/work-anim-regression.cjs
