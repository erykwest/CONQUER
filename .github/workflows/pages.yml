name: Publish branch previews

on:
  push:
    branches-ignore:
      - gh-pages
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: branch-previews
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout all branches
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build multi-branch static site
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _site _branch_tmp
          mkdir -p _site _branch_tmp

          mapfile -t branches < <(
            git for-each-ref --format='%(refname:short)' refs/remotes/origin/               | sed 's#^origin/##'               | grep -Ev '^(HEAD|gh-pages)$'               | sort -u
          )

          for branch in "${branches[@]}"; do
            [ -n "$branch" ] || continue
            safe="${branch//\//-}"
            rm -rf _branch_tmp/*
            git archive "origin/$branch" | tar -x -C _branch_tmp
            rm -rf "_branch_tmp/.github"

            sha="$(git rev-parse "origin/$branch")"
            short="${sha:0:12}"
            build="_site/_builds/$safe/$short"
            mkdir -p "$build"
            cp -a _branch_tmp/. "$build/"

            if [ -f "$build/index.html" ]; then
              page="$build/index.html"
              sed -i "s@href=\"./src/settlement.css\"@href=\"./src/settlement.css?v=$short\"@g" "$page"
              for asset in settlement-core.js settlement-world.js settlement-castle.js settlement-population.js settlement-render.js settlement-app.js; do
                sed -i "s@src=\"./src/$asset\"@src=\"./src/$asset?v=$short\"@g" "$page"
              done
              sed -i "s@</body>@<div id=\"buildStamp\" style=\"position:fixed;right:8px;bottom:6px;z-index:9999;font:10px monospace;color:#aaa;opacity:.65;pointer-events:none\">build $short</div></body>@" "$page"
            fi

            mkdir -p "_site/$safe"
            printf '{"build":"%s","path":"../_builds/%s/%s/"}\n' "$short" "$safe" "$short" > "_site/$safe/version.json"
            cat > "_site/$safe/index.html" <<HTML
            <!doctype html>
            <meta charset="utf-8">
            <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
            <meta http-equiv="Pragma" content="no-cache">
            <meta http-equiv="Expires" content="0">
            <title>CONQUER — loading $branch</title>
            <style>body{font:16px system-ui;background:#17130f;color:#eee;padding:32px}</style>
            <p>Loading latest <b>$branch</b> preview…</p>
            <script>
            fetch('./version.json?t='+Date.now(),{cache:'no-store'})
              .then(r=>r.json())
              .then(v=>location.replace(v.path+'?v='+v.build))
              .catch(e=>document.body.insertAdjacentHTML('beforeend','<pre>'+e+'</pre>'));
            </script>
            HTML

            if [ "$branch" = "main" ]; then
              cat > "_site/index.html" <<HTML
            <!doctype html>
            <meta charset="utf-8">
            <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
            <title>CONQUER</title>
            <script>
            fetch('./main/version.json?t='+Date.now(),{cache:'no-store'})
              .then(r=>r.json())
              .then(v=>location.replace('./_builds/main/'+v.build+'/?v='+v.build));
            </script>
            HTML
            fi
          done

          touch _site/.nojekyll

          cat > _site/branches.html <<'HTML'
          <!doctype html>
          <meta charset="utf-8">
          <title>CONQUER branch previews</title>
          <style>
            body{font:16px system-ui;background:#17130f;color:#eee;padding:32px}
            a{color:#e99a4b;display:block;margin:10px 0}
          </style>
          <h1>CONQUER branch previews</h1>
          HTML

          for branch in "${branches[@]}"; do
            safe="${branch//\//-}"
            printf '<a href="./%s/">%s</a>\n' "$safe" "$branch" >> _site/branches.html
          done

      - name: Publish gh-pages branch
        shell: bash
        run: |
          set -euo pipefail
          cp -a _site /tmp/conquer-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan gh-pages
          git rm -rf . >/dev/null 2>&1 || true
          cp -a /tmp/conquer-pages/. .
          git add -A
          git commit -m "deploy: branch previews from ${GITHUB_SHA}"
          git push --force origin gh-pages
