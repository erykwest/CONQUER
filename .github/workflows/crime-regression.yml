name: Crime skeleton regression

on:
  pull_request:
    paths:
      - 'crime/**'
      - 'qa/crime-regression.cjs'
      - 'qa/crime-buildings-regression.cjs'
      - 'qa/court-people-regression.cjs'
      - 'src/settlement-court-people.js'
      - 'src/settlement-wardrobe.js'
      - 'src/settlement-core.js'
      - 'src/settlement-castle-placement.js'
      - 'src/settlement-siege.js'
      - 'src/settlement-civic3d.js'
      - 'src/settlement-civic-annexes.js'
      - 'src/settlement-events3d.js'
      - 'src/assets/civic-models.js'
      - 'src/assets/event-models.js'
      - '.github/workflows/crime-regression.yml'
  push:
    branches:
      - main
    paths:
      - 'crime/**'
      - 'qa/crime-regression.cjs'
      - 'qa/crime-buildings-regression.cjs'
      - '.github/workflows/crime-regression.yml'

permissions:
  contents: read

jobs:
  crime-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test criminality and public-order skeleton
        run: node qa/crime-regression.cjs
      - name: Test crime buildings and rooms (town hall chambers, almshouse, pillory, gallows)
        run: node qa/crime-buildings-regression.cjs
      - name: Test the tribunal in session (court people, costumes of office)
        run: node qa/court-people-regression.cjs
