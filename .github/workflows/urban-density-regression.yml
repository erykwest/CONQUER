name: Urban density regression
on:
  push:
    branches:
      - urban-density-l3-l4
  workflow_dispatch:
jobs:
  density-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Test manual upgrades and frontage generation
        run: node qa/urban-density-regression.cjs
