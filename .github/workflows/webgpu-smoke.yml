name: WebGPU branch smoke

on:
  push:
    branches: [main]
    paths:
      - 'src/settlement-webgpu.js'
      - 'src/settlement-render.js'
      - 'src/settlement-world3d.js'
      - 'src/settlement-mesh3d.js'
      - 'qa/ui-combat-regression.mjs'
      - '.github/workflows/webgpu-smoke.yml'
  pull_request:
    branches: [main]
    paths:
      - 'src/settlement-webgpu.js'
      - 'src/settlement-render.js'
      - 'src/settlement-world3d.js'
      - 'src/settlement-mesh3d.js'
      - 'qa/ui-combat-regression.mjs'
      - '.github/workflows/webgpu-smoke.yml'
  workflow_dispatch:

jobs:
  webgpu-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Start static server
        run: |
          python3 -m http.server 4173 >/tmp/conquer-webgpu-http.log 2>&1 &
          sleep 2

      - name: Install cached Chromium and pinned Playwright
        uses: ./.github/actions/playwright-setup

      - name: Renderer-specific deterministic regressions
        run: |
          node qa/webgl-error-poll-regression.cjs
          node qa/paused-render-regression.cjs
          node qa/occlusion-clip-regression.cjs

      - name: Verify Builder, industry and Combat browser integration
        run: node qa/ui-combat-regression.mjs

      - name: Exercise hybrid renderer and fallback
        shell: bash
        run: |
          cat > webgpu-smoke.mjs <<'JS'
          import { chromium } from 'playwright';

          const browser=await chromium.launch({
            headless:true,
            args:[
              '--enable-unsafe-webgpu',
              '--use-angle=swiftshader'
            ]
          });

          async function probe(url){
            const context=await browser.newContext({viewport:{width:1280,height:900}});
            const page=await context.newPage();
            const errors=[];
            page.on('pageerror',e=>errors.push(String(e.stack||e)));
            await page.goto(url,{waitUntil:'domcontentloaded',timeout:60000});
            await page.waitForFunction(()=>{
              const s=window.ConquerWebGPU?.status?.();
              return !s||s.frames>=1||!!s.fallbackReason;
            },{timeout:10000}).catch(()=>{});

            await page.waitForTimeout(1000);

            const result=await page.evaluate(()=>{
              const before=performance.now();
              draw();
              const drawMs=performance.now()-before;
              const status=window.ConquerWebGPU?.status?.()||null;
              return{
                status,
                drawMs,
                renderer:document.documentElement.dataset.renderer||null,
                navigatorGpu:!!navigator.gpu,
                structures:State.structures.length,
                cacheViews:Object.fromEntries(Object.entries(sceneCache).map(([k,v])=>[k,!!v.view])),
                perf:{
                  webgpuActive:window.__conquerPerf?.webgpuActive??null,
                  webgpuFrames:window.__conquerPerf?.webgpuFrames??0,
                  webgpuUploads:window.__conquerPerf?.webgpuUploads??0
                }
              };
            });

            await context.close();
            return{url,result,errors};
          }

          const hybrid=await probe('http://127.0.0.1:4173/');
          const fallback=await probe('http://127.0.0.1:4173/?renderer=canvas2d');
          console.log(JSON.stringify({hybrid,fallback},null,2));

          const hybridFatal=hybrid.errors.length>0||!hybrid.result.status||hybrid.result.renderer==null;
          const fallbackFatal=fallback.errors.length>0||
            fallback.result.status?.active!==false||
            fallback.result.status?.fallbackReason!=='forced-canvas2d'||
            fallback.result.renderer!=='canvas2d';

          if(hybrid.result.navigatorGpu&&hybrid.result.status?.supported&&!hybrid.result.status?.active){
            const exercisedBeforeLoss=
              hybrid.result.status?.fallbackReason==='device-lost'&&
              hybrid.result.status?.frames>=1&&
              hybrid.result.status?.uploads>=4;
            if(!exercisedBeforeLoss){
              console.error('navigator.gpu exists but hybrid renderer never exercised:',hybrid.result.status);
              process.exitCode=1;
            }
          }
          if(hybrid.result.status?.fallbackReason==='blank-frame'){
            console.error('WebGPU runtime visual probe detected a blank frame:',hybrid.result.status);
            process.exitCode=1;
          }
          if(hybridFatal||fallbackFatal)process.exitCode=1;
          await browser.close();
          JS
          node webgpu-smoke.mjs
