name: CANS skeleton regression

# Abort superseded PR runs of this workflow (never cancel scheduled/main runs).
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
on:
  push:
    branches: [main, cans, audit-hardening]
  pull_request:
    paths:
      - 'src/settlement-cans.js'
      - 'qa/cans-regression.cjs'
      - '.github/workflows/cans-regression.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cans-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: CANS logical invariants and persistence
        run: node qa/cans-regression.cjs
