name: Settlement routing and spawn regression

# Abort superseded PR runs of this workflow (never cancel scheduled/main runs).
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# The workflow/job identifiers are retained to avoid changing check names.
# Every PR that changes anything outside docs/ and *.md runs the complete
# deterministic suite (~90 s); documentation-only PRs run the fast smoke.
# Weekly/manual runs always run everything.
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * 0'

permissions:
  contents: read

jobs:
  settlement-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout full history for trusted PR diff
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify CI P1 orchestration contracts
        run: node qa/ci-p1-regression.cjs
      - name: Determine validation tier
        id: tier
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [[ "$EVENT_NAME" != "pull_request" ]]; then
            echo 'full=true' >> "$GITHUB_OUTPUT"
            echo 'Weekly or manual run: complete suite'
            exit 0
          fi
          if [[ ! "$BASE_SHA" =~ ^[a-f0-9]{40}$ || ! "$HEAD_SHA" =~ ^[a-f0-9]{40}$ ]]; then
            echo 'Invalid PR SHAs, refusing to skip complete regression suite' >&2
            exit 1
          fi
          git diff --name-only --diff-filter=ACDMRT "$BASE_SHA...$HEAD_SHA" > "$RUNNER_TEMP/ci-pr-changed.txt"
          echo 'Changed paths:'
          cat "$RUNNER_TEMP/ci-pr-changed.txt"
          # Specialist path filters cannot be trusted to cover every source a test
          # reads, so any path outside docs/ and *.md runs the complete suite.
          if grep -Evq '^(docs/|.*\.md$)' "$RUNNER_TEMP/ci-pr-changed.txt"; then
            echo 'full=true' >> "$GITHUB_OUTPUT"
            echo 'Code, test, asset or config change: complete pre-merge regression suite'
          else
            echo 'full=false' >> "$GITHUB_OUTPUT"
            echo 'Documentation-only change: fast smoke'
          fi
      - name: Fast settlement and routing checks
        if: github.event_name == 'pull_request' && steps.tier.outputs.full == 'false'
        run: |
          node qa/ci-p0-regression.cjs
          node qa/settlement-routing-spawn-regression.cjs
          node qa/river-forest-detour-regression.cjs
          node qa/main-road-finalization-regression.cjs
          node qa/urban2-spawn-regression.cjs
      - name: Complete deterministic regressions (non-docs PR/manual/weekly)
        if: steps.tier.outputs.full == 'true'
        shell: bash
        run: |
          # Shared runner discovers every qa/*-regression.cjs and reports all failures.
          node tools/run-regressions.cjs --report output/qa/regressions.json
      - name: Save complete regression results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deterministic-regressions
          path: output/qa/regressions.json
          if-no-files-found: ignore
          retention-days: 14
      - name: Syntax-check all source modules (non-docs PR/manual/weekly)
        if: steps.tier.outputs.full == 'true'
        run: |
          for src in src/*.js; do
            node --check "$src"
          done
