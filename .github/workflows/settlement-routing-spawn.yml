name: Settlement routing and spawn regression

# Abort superseded PR runs of this workflow (never cancel scheduled/main runs).
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# The workflow/job identifiers are retained to avoid changing check names.
# PRs run fast route/spawn checks; shared engine edits also run the complete
# deterministic suite before merging. Weekly/manual runs always run everything.
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * 0'

permissions:
  contents: read

jobs:
  settlement-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout full history for trusted PR diff
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify CI P1 orchestration contracts
        run: node qa/ci-p1-regression.cjs
      - name: Determine validation tier
        id: tier
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [[ "$EVENT_NAME" != "pull_request" ]]; then
            echo 'full=true' >> "$GITHUB_OUTPUT"
            echo 'Weekly or manual run: complete suite'
            exit 0
          fi
          if [[ ! "$BASE_SHA" =~ ^[a-f0-9]{40}$ || ! "$HEAD_SHA" =~ ^[a-f0-9]{40}$ ]]; then
            echo 'Invalid PR SHAs, refusing to skip complete regression suite' >&2
            exit 1
          fi
          git diff --name-only --diff-filter=ACDMRT "$BASE_SHA...$HEAD_SHA" > "$RUNNER_TEMP/ci-pr-changed.txt"
          echo 'Changed paths:'
          cat "$RUNNER_TEMP/ci-pr-changed.txt"
          # Shared application state, world generation, persistence, navigation,
          # terrain/placement or app entrypoint modifications are high risk.
          if grep -Eq '^(index\.html|src/settlement-(core|app|app-simulation|app-persistence|world|world3d|castle3d|placement|castle-placement|population-navigation)\.js|\.github/workflows/settlement-routing-spawn\.yml|qa/ci-(p0|p1)-regression\.cjs) "$RUNNER_TEMP/ci-pr-changed.txt"; then
            echo 'full=true' >> "$GITHUB_OUTPUT"
            echo 'Shared-engine change: complete pre-merge regression suite'
          else
            echo 'full=false' >> "$GITHUB_OUTPUT"
            echo 'Isolated change: targeted fast smoke; subsystem workflows remain active'
          fi
      - name: Fast settlement and routing checks
        if: github.event_name == 'pull_request' && steps.tier.outputs.full == 'false'
        run: |
          node qa/ci-p0-regression.cjs
          node qa/settlement-routing-spawn-regression.cjs
          node qa/river-forest-detour-regression.cjs
          node qa/main-road-finalization-regression.cjs
          node qa/urban2-spawn-regression.cjs
      - name: Complete deterministic regressions (risk/manual/weekly)
        if: steps.tier.outputs.full == 'true'
        run: |
          for test in qa/*-regression.cjs; do
            echo "Running $test"
            node "$test"
          done
      - name: Syntax-check all source modules (risk/manual/weekly)
        if: steps.tier.outputs.full == 'true'
        run: |
          for src in src/*.js; do
            node --check "$src"
          done
 "$RUNNER_TEMP/ci-pr-changed.txt"; then
            echo 'full=true' >> "$GITHUB_OUTPUT"
            echo 'Shared-engine change: complete pre-merge regression suite'
          else
            echo 'full=false' >> "$GITHUB_OUTPUT"
            echo 'Isolated change: targeted fast smoke; subsystem workflows remain active'
          fi
      - name: Fast settlement and routing checks
        if: github.event_name == 'pull_request' && steps.tier.outputs.full == 'false'
        run: |
          node qa/ci-p0-regression.cjs
          node qa/settlement-routing-spawn-regression.cjs
          node qa/river-forest-detour-regression.cjs
          node qa/main-road-finalization-regression.cjs
          node qa/urban2-spawn-regression.cjs
      - name: Complete deterministic regressions (risk/manual/weekly)
        if: steps.tier.outputs.full == 'true'
        run: |
          for test in qa/*-regression.cjs; do
            echo "Running $test"
            node "$test"
          done
      - name: Syntax-check all source modules (risk/manual/weekly)
        if: steps.tier.outputs.full == 'true'
        run: |
          for src in src/*.js; do
            node --check "$src"
          done
