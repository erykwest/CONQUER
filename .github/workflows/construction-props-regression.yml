name: Construction props regression
on:
  pull_request:
    branches: [main]
    paths:
      - 'src/settlement-construction-props.js'
      - 'src/settlement-construction-assembly.js'
      - 'src/settlement-castle3d.js'
      - 'src/settlement-buildings.js'
      - 'qa/construction-assembly-regression.cjs'
      - 'src/assets/construction-models.js'
      - 'src/settlement-mesh3d.js'
      - 'src/settlement-render.js'
      - 'qa/construction-props-regression.cjs'
      - '.github/workflows/construction-props-regression.yml'
  workflow_dispatch:
jobs:
  construction-props:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Check source and test syntax
        run: |
          node --check src/settlement-construction-props.js
          node --check src/assets/construction-models.js
          node --check qa/construction-props-regression.cjs
          node --check src/settlement-construction-assembly.js
          node --check qa/construction-assembly-regression.cjs
      - name: Run construction-props regression
        run: node qa/construction-props-regression.cjs
      - name: Run construction-assembly regression
        run: node qa/construction-assembly-regression.cjs
