name: Diagnose Pages vs Vercel

on:
  workflow_dispatch:
  push:
    branches:
      - landscape

jobs:
  browser-diff:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Wait for preview publishing
        run: sleep 75

      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null
          npx playwright install --with-deps chromium >/dev/null

      - name: Run browser diagnostics
        shell: bash
        run: |
          cat > diagnose.mjs <<'JS'
          import { chromium } from 'playwright';

          const targets = [
            ['pages', 'https://erykwest.github.io/CONQUER/landscape/'],
            ['vercel', 'https://conquer-git-landscape-erykwests-projects.vercel.app/']
          ];

          const browser = await chromium.launch({ headless: true });

          for (const [name, url] of targets) {
            const context = await browser.newContext({ viewport: { width: 1440, height: 1000 } });
            const page = await context.newPage();
            const consoleLog = [];
            const errors = [];
            const failed = [];

            page.on('console', m => consoleLog.push(m.type() + ': ' + m.text()));
            page.on('pageerror', e => errors.push(String(e.stack || e)));
            page.on('requestfailed', r => failed.push(r.url() + ' :: ' + (r.failure()?.errorText || 'failed')));
            page.on('response', r => { if (r.status() >= 400) failed.push(r.status() + ' ' + r.url()); });

            let gotoStatus = null;
            try {
              const res = await page.goto(url, { waitUntil: 'networkidle', timeout: 60000 });
              gotoStatus = res?.status() ?? null;
            } catch (e) {
              errors.push('goto: ' + String(e));
            }

            await page.waitForTimeout(2500);

            const snapshot = await page.evaluate(() => {
              const canvas = document.getElementById('c');
              const rect = canvas?.getBoundingClientRect();
              let runtime = {};
              try {
                runtime = eval('({drawType:typeof draw,fitType:typeof fit,resizeType:typeof resize,tool:State?.tool?JSON.parse(JSON.stringify(State.tool)):null,view:State?.view?JSON.parse(JSON.stringify(State.view)):null,structures:State?.structures?.length??null,environment:State?.environment?.length??null})');
              } catch (e) {
                runtime = { evalError: String(e) };
              }
              return {
                title: document.title,
                status: document.getElementById('status')?.textContent,
                towerButtons: document.querySelectorAll('[data-tower]').length,
                seasonButtons: document.querySelectorAll('[data-season]').length,
                canvas: rect ? { x: rect.x, y: rect.y, w: rect.width, h: rect.height, width: canvas.width, height: canvas.height } : null,
                buildStamp: document.getElementById('buildStamp')?.textContent || null,
                runtime
              };
            });

            let towerTest = {};
            try {
              await page.locator('[data-tower="square"][data-size="1"]').click();
              await page.waitForTimeout(150);
              const target = await page.evaluate(() => {
                try {
                  return eval('(()=>{const p=w2s({x:75,y:75});return{x:p.x,y:p.y,before:State.structures.length,tool:JSON.parse(JSON.stringify(State.tool))}})()');
                } catch (e) { return { error:String(e) }; }
              });
              if (!target.error) {
                await page.mouse.click(target.x, target.y);
                await page.waitForTimeout(250);
              }
              const after = await page.evaluate(() => {
                try {
                  return eval('({after:State.structures.length,tool:JSON.parse(JSON.stringify(State.tool)),status:document.getElementById("status")?.textContent})');
                } catch (e) { return { error:String(e) }; }
              });
              towerTest = { target, after };
            } catch (e) {
              towerTest = { error: String(e) };
            }

            console.log('\n===== ' + name.toUpperCase() + ' =====');
            console.log(JSON.stringify({ url, gotoStatus, snapshot, towerTest, consoleLog, errors, failed }, null, 2));
            await context.close();
          }

          await browser.close();
          JS
          node diagnose.mjs
