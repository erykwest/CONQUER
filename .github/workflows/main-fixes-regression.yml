name: Main fixes regression

# Abort superseded PR runs of this workflow (never cancel scheduled/main runs).
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
on:
  pull_request:
    branches: [main]
    paths:
      - src/settlement-world.js
      - src/settlement-world3d.js
      - qa/main-fixes-browser.mjs
      - qa/figure-billboards-browser.mjs
      - qa/vehicle-cards-browser.mjs
      - src/settlement-vehicles.js
      - src/settlement-wagons.js
      - src/settlement-road-sign-tests.js
      - qa/ui-combat-regression.mjs
      - .github/workflows/main-fixes-regression.yml
      - .github/actions/playwright-setup/action.yml
permissions:
  contents: read
jobs:
  regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      # Always-on settlement-qa owns road finalization and spawn in fast/full tiers.
      - name: Renderer-specific deterministic regressions
        run: |
          node qa/webgl-error-poll-regression.cjs
          node qa/paused-render-regression.cjs
      - name: JavaScript syntax
        run: |
          for file in src/settlement-world.js src/settlement-world3d.js src/settlement-vehicles.js qa/main-fixes-browser.mjs qa/vehicle-cards-browser.mjs qa/ui-combat-regression.mjs; do node --check "$file"; done
  browser:
    # Pinned like the other browser jobs: Playwright 1.56 has no Chromium build for ubuntu-latest (26.04).
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Install cached Chromium and pinned Playwright
        uses: ./.github/actions/playwright-setup
      - name: Start local server
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/main-fixes-http.log 2>&1 &
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:4173/index.html >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/main-fixes-http.log
          exit 1
      - name: WebGL rebuilds and genuine context-loss fallback
        run: node qa/main-fixes-browser.mjs
      - name: Civilian billboards, occlusion and atlas reuse
        run: node qa/figure-billboards-browser.mjs
      - name: Vehicle cards (carts, wagons, coaches), occlusion and 2D fallback
        run: node qa/vehicle-cards-browser.mjs
      - name: Procedural defaults, explicit DEV controls and full UI/Combat
        run: node qa/ui-combat-regression.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: main-fixes-browser
          path: |
            output/playwright/main-fixes/
            output/playwright/figure-billboards/
            output/playwright/vehicle-cards/
          retention-days: 7
