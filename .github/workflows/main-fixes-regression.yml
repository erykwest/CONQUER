name: Main fixes regression
on:
  push:
    branches: [fix/main-founding-dev-webgl-20261023]
  pull_request:
    branches: [main]
    paths:
      - src/settlement-world.js
      - src/settlement-world3d.js
      - qa/main-road-finalization-regression.cjs
      - qa/main-fixes-browser.mjs
      - qa/ui-combat-regression.mjs
      - .github/workflows/main-fixes-regression.yml
permissions:
  contents: read
jobs:
  regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Deterministic regressions
        run: |
          for test in qa/*-regression.cjs; do
            echo "Running $test"
            node "$test"
          done
      - name: JavaScript syntax
        run: |
          for file in src/*.js qa/*.cjs qa/*.mjs; do node --check "$file"; done
      - name: Context sync against main
        run: CONTEXT_BASE_SHA="$(git rev-parse origin/main)" CONTEXT_HEAD_SHA="$GITHUB_SHA" node tools/context-guard.cjs
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Chromium
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install chromium
      - name: Start local server
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/main-fixes-http.log 2>&1 &
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:4173/index.html >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/main-fixes-http.log
          exit 1
      - name: WebGL rebuilds and genuine context-loss fallback
        run: node qa/main-fixes-browser.mjs
      - name: Procedural defaults, explicit DEV controls and full UI/Combat
        run: node qa/ui-combat-regression.mjs
      - name: Asset Lab visual audit
        run: node qa/asset-audit.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: main-fixes-browser
          path: |
            output/playwright/main-fixes/
            artifacts/asset-audit/
          retention-days: 7
