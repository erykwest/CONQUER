name: CAMP regression
on:
  push:
    branches: [camp]
  pull_request:
    paths:
      - camp/**
      - src/settlement-camp.js
      - src/settlement-combat.js
      - src/settlement-core.js
      - src/settlement-population.js
      - src/settlement-render.js
      - src/settlement-ambient-light.js
      - src/settlement-wolves.js
      - qa/seasonal-solar-regression.cjs
      - src/settlement-population-garrisons.js
      - src/settlement-app-persistence.js
      - qa/camp-regression.cjs
      - qa/patrol-regression.cjs
      - .github/workflows/camp-regression.yml
jobs:
  camp-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax
        run: |
          node --check src/settlement-camp.js
          node --check src/settlement-core.js
          node --check src/settlement-population.js
          node --check src/settlement-ambient-light.js
          node --check src/settlement-app-calendar-ui.js
          node --check src/settlement-combat.js
          node --check src/settlement-animals.js
          node --check src/settlement-wolves.js
          node --check src/settlement-world.js
          node --check src/settlement-population-garrisons.js
          node --check src/settlement-app-persistence.js
      - name: Behavioral regression
        run: |
          node qa/seasonal-solar-regression.cjs
          node qa/calendar-speed-regression.cjs
          node qa/ambient-light-regression.cjs
          node qa/camp-regression.cjs
          node qa/wolves-regression.cjs
          node qa/animals-regression.cjs
          node qa/night-vision-regression.cjs
          node qa/patrol-regression.cjs
          node qa/combat-selection-regression.cjs
          node qa/settlement-routing-spawn-regression.cjs
