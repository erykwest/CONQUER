name: Penetrate walls under towers

on:
  push:
    paths:
      - '.github/workflows/penetrate-walls-under-towers.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Extend snapped wall endpoints under towers
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = "function boundaryPoint(s,target){if(!s||!['tower','gate'].includes(s.type))return target;const dx=target.x-s.x,dy=target.y-s.y,L=Math.hypot(dx,dy)||1,ux=dx/L,uy=dy/L;if(s.shape==='round')return{x:s.x+ux*s.r,y:s.y+uy*s.r};const h=s.size/2,tx=Math.abs(ux)>1e-6?h/Math.abs(ux):Infinity,ty=Math.abs(uy)>1e-6?h/Math.abs(uy):Infinity,t=Math.min(tx,ty);return{x:s.x+ux*t,y:s.y+uy*t}}"
          new = "function boundaryPoint(s,target){if(!s||!['tower','gate'].includes(s.type))return target;const dx=target.x-s.x,dy=target.y-s.y,L=Math.hypot(dx,dy)||1,ux=dx/L,uy=dy/L;let edge;if(s.shape==='round')edge=s.r;else{const h=s.size/2,tx=Math.abs(ux)>1e-6?h/Math.abs(ux):Infinity,ty=Math.abs(uy)>1e-6?h/Math.abs(uy):Infinity;edge=Math.min(tx,ty)}const penetration=Math.min(.5,edge*.7),t=Math.max(0,edge-penetration);return{x:s.x+ux*t,y:s.y+uy*t}}"
          if s.count(old) != 1:
              raise SystemExit(f'boundaryPoint anchor mismatch: found {s.count(old)}')
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
          print('Wall/tower overlap patched')
          PY

      - name: Validate
        shell: bash
        run: |
          grep -q "const penetration=Math.min(.5,edge\*.7)" index.html
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script(?:\s[^>]*)?>([\s\S]*?)</script>',s)
          Path('/tmp/conquer.js').write_text('\n'.join(scripts),encoding='utf-8')
          PY
          node --check /tmp/conquer.js

      - name: Commit fix and remove one-shot runner
        shell: bash
        run: |
          rm -f .github/workflows/penetrate-walls-under-towers.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/penetrate-walls-under-towers.yml
          git commit -m "fix: overlap walls beneath towers"
          git push origin main
