name: One-time safe cleanup of obsolete remote branches (2026-11-03)

# User-authorized feature/* audit: merged cutaway/houses and superseded UI/economy/forests.
# Main 9af18dd: 17 pertinent regression suites passed; both active CRIME branches preserved.
# UI files match squash 5ddefa6 (shell differs only in CRLF); main extends them.
# Forest SVG/layout/cache and depth-tested trees already replace the old flat prototype.
# Economy #98/#99/#101/#105/#108 replaces closed #55; no old ledgers or 3D figures restored.
# Runs only when this exact workflow changes on main.
# Every candidate is pinned below; new work and open-PR heads/bases are preserved.
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/prune-obsolete-branches-20261023.yml

permissions:
  contents: write

jobs:
  prune:
    if: github.repository == 'erykwest/CONQUER'
    runs-on: ubuntu-latest
    steps:
      - name: Verify exact heads, merged evidence and live PRs before deletion
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          removed=0; skipped=0; failures=0; examined=0
          echo '## Branch cleanup — 2026-11-03' >> "$GITHUB_STEP_SUMMARY"
          while IFS='|' read -r branch expected evidence; do
            [[ -z "$branch" ]] && continue
            if [[ "$expected" == '@this-commit' ]]; then expected="$GITHUB_SHA"; fi
            examined=$((examined+1))
            echo "Candidate $examined: $branch"
            if [[ "$branch" == main ]]; then exit 1; fi
            protected="$(gh api --paginate "repos/$GH_REPO/pulls?state=open&per_page=100" --jq '.[] | .head.ref, .base.ref')"
            if grep -Fxq "$branch" <<< "$protected"; then
              echo "SKIP open PR: $branch"; skipped=$((skipped+1)); continue
            fi
            current="$(gh api "repos/$GH_REPO/git/ref/heads/$branch" --jq '.object.sha' 2>/dev/null)" || {
              echo "SKIP missing: $branch"; skipped=$((skipped+1)); continue
            }
            if [[ "$current" != "$expected" ]]; then
              echo "SKIP changed head: $branch"; skipped=$((skipped+1)); continue
            fi
            if [[ "$evidence" == '-' ]]; then
              merged_sha="$expected"
            elif [[ "$evidence" == replacement:* ]]; then
              # Audited replacements: #61 siege damage, #78 events, #96 approved 2D diplomacy.
              # D-046 explicitly discards the old 3D knight implementation.
              case "$branch:$evidence" in
                assedio:replacement:61|events:replacement:78|feature/knights-messenger-caravans:replacement:96|feature/economic-balances-20261019:replacement:105) ;;
                *) echo 'Unapproved replacement'; exit 1 ;;
              esac
              pr="${evidence#replacement:}"
              merged_sha="$(gh api "repos/$GH_REPO/pulls/$pr" --jq 'select(.merged_at != null) | .merge_commit_sha')"
            elif [[ "$evidence" == audited-commit:* ]]; then
              # Exact audited replacement commits already on main; never accept arbitrary pairs.
              case "$branch:$evidence" in
                feature/ui-shell:audited-commit:5ddefa684c80239d3a298e546167b5b4b81a8d1f|feature/landscape-forests:audited-commit:c2d76be90a41d491d2ffd8864352219ad6fa52cb) ;;
                *) echo 'Unapproved audited commit'; exit 1 ;;
              esac
              merged_sha="${evidence#audited-commit:}"
            else
              entry="$(gh api "repos/$GH_REPO/pulls/$evidence" --jq '[.head.ref,.head.sha,(.merged_at // ""),(.merge_commit_sha // "")] | join("|")')"
              IFS='|' read -r pr_branch pr_sha merged_at merged_sha <<< "$entry"
              if [[ "$pr_branch" != "$branch" || "$pr_sha" != "$expected" || -z "$merged_at" ]]; then
                echo "SKIP PR mismatch: $branch"; skipped=$((skipped+1)); continue
              fi
            fi
            if [[ ! "$merged_sha" =~ ^[a-f0-9]{40}$ ]]; then
              echo "SKIP no merged proof: $branch"; skipped=$((skipped+1)); continue
            fi
            ancestry="$(gh api "repos/$GH_REPO/compare/$merged_sha...main" --jq '.status')"
            if [[ "$ancestry" != ahead && "$ancestry" != identical ]]; then
              echo "SKIP not in main: $branch"; skipped=$((skipped+1)); continue
            fi
            # Re-read immediately before deletion; refuse branches updated during the audit.
            current="$(gh api "repos/$GH_REPO/git/ref/heads/$branch" --jq '.object.sha')"
            if [[ "$current" != "$expected" ]]; then
              echo "SKIP changed during audit: $branch"; skipped=$((skipped+1)); continue
            fi
            if gh api -X DELETE "repos/$GH_REPO/git/refs/heads/$branch" >/dev/null; then
              echo "DELETED $branch"
              echo "- DELETED: \`$branch\` ($expected; evidence $evidence)" >> "$GITHUB_STEP_SUMMARY"
              removed=$((removed+1))
            else
              echo "FAILED $branch"; failures=$((failures+1))
            fi
          done <<'BRANCHES'
          feature/cutaway-floors|b2ef29e783172561e33905b7b4afe4d71edf7f13|138
          feature/houses-blender|97c8cdf95f429c41dfecf391fedef40958771395|136
          feature/economic-balances-20261019|ec13591c68a392bc346305ee5c32b861893d27d1|replacement:105
          feature/landscape-forests|8be5a071246e47afec6627815b8e6f0f8835667e|audited-commit:c2d76be90a41d491d2ffd8864352219ad6fa52cb
          feature/ui-shell|ee51adf21f2ba2ddb524190dac3ea7a1fc5ec811|audited-commit:5ddefa684c80239d3a298e546167b5b4b81a8d1f
          BRANCHES
          echo "Result: $removed removed; $skipped skipped; $failures failed" | tee -a "$GITHUB_STEP_SUMMARY"
          ((failures == 0))
