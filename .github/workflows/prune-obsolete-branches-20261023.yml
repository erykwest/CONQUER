name: One-time safe cleanup of obsolete remote branches (2026-10-23)

# Runs only when THIS workflow is introduced/modified on main.
# Intentionally not scheduled; no deletion on ordinary pushes.
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/prune-obsolete-branches-20261023.yml

permissions:
  contents: write

jobs:
  prune:
    name: Remove exact merged or fully-absorbed branch refs
    if: github.repository == 'erykwest/CONQUER'
    runs-on: ubuntu-latest
    steps:
      - name: Verify live PRs, exact ref SHA, then delete obsolete branches
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # Refuse any branch serving an OPEN pull request, whether head or base.
          protected="$(gh api --paginate "repos/$GH_REPO/pulls?state=open&per_page=100" --jq '.[] | .head.ref, .base.ref')"
          failures=0
          removed=0
          skipped=0
          {
            echo "## Obsolete branch cleanup"
            echo "Exact-SHA and live-PR guarded; no forced ref updates."
          } >> "$GITHUB_STEP_SUMMARY"

          while IFS='|' read -r branch expected pr; do
            [[ -z "$branch" ]] && continue
            if [[ "$branch" == main ]] || grep -Fxq "$branch" <<< "$protected"; then
              echo "SKIP protected/open-PR: $branch"
              echo "- SKIPPED (protected/open PR): \`$branch\`" >> "$GITHUB_STEP_SUMMARY"
              skipped=$((skipped+1))
              continue
            fi
            current="$(gh api "repos/$GH_REPO/git/ref/heads/$branch" --jq '.object.sha' 2>/dev/null)" || {
              echo "SKIP missing ref: $branch"
              skipped=$((skipped+1))
              continue
            }
            if [[ "$current" != "$expected" ]]; then
              echo "SKIP changed ref: $branch expected=$expected now=$current"
              echo "- SKIPPED (head changed): \`$branch\`" >> "$GITHUB_STEP_SUMMARY"
              skipped=$((skipped+1))
              continue
            fi
            if [[ "$pr" != "-" ]]; then
              # For squash merges, old branch commits do not become ancestors of main:
              # verify the PR was actually merged with this exact head.
              entry="$(gh api "repos/$GH_REPO/pulls/$pr" --jq '[.head.ref,.head.sha,(.merged_at // "")] | join("|")')"
              IFS='|' read -r pr_branch pr_sha pr_merged <<< "$entry"
              if [[ "$pr_branch" != "$branch" || "$pr_sha" != "$expected" || -z "$pr_merged" ]]; then
                echo "SKIP PR metadata mismatch: $branch #$pr"
                skipped=$((skipped+1))
                continue
              fi
            else
              # Non-PR ref may be pruned only if its exact commit is an ancestor
              # of main. 'ahead' means HEAD main is ahead of the old branch.
              ancestry="$(gh api "repos/$GH_REPO/compare/$expected...main" --jq '.status')"
              if [[ "$ancestry" != "ahead" && "$ancestry" != "identical" ]]; then
                echo "SKIP unmerged commits: $branch ($ancestry)"
                skipped=$((skipped+1))
                continue
              fi
            fi
            if gh api -X DELETE "repos/$GH_REPO/git/refs/heads/$branch" >/dev/null; then
              echo "DELETED $branch"
              echo "- DELETED: \`$branch\`" >> "$GITHUB_STEP_SUMMARY"
              removed=$((removed+1))
            else
              echo "FAILED $branch"
              echo "- FAILED (permissions/API): \`$branch\`" >> "$GITHUB_STEP_SUMMARY"
              failures=$((failures+1))
            fi
          done <<'BRANCHES'
          docs/backlog-reaudit-20261023|237e051635e2a4469c6d2745cb4c3d39dcf52096|83
          docs/full-backlog-audit-20261022|341ba55d6111830964368d75e7e19e7a3c219dd9|75
          feat/asset-lab-complete-catalog|2e133d733aa2a6c653042c7cc9d8844ef289433a|81
          feat/unified-visual-asset-lab|df35206ac309ea3cf702c360667ad2c27a31abf5|79
          fix/asset-lab-rotation-and-components|206426eb1ab44aacd67ad4924ce07dafb2a065c1|80
          portoni|a504ea65ac2b8c748035fc8cc78420f2cb626d50|76
          feature/bridge-earthworks-converge|5228837185ac47a09b2170c25ceb1d630ef2403f|-
          fix/main-founding-dev-webgl-20261023|518e830547b66c12deefa0833487ea76b81c7746|-
          BRANCHES
          echo "Result: $removed removed; $skipped safely skipped; $failures failed"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Result: $removed removed; $skipped skipped; $failures failed." >> "$GITHUB_STEP_SUMMARY"
          ((failures == 0))
