name: Gate six-socket and cutaway regression

# Abort superseded PR runs of this workflow (never cancel scheduled/main runs).
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
on:
  pull_request:
    branches: [main]
    paths:
      - 'src/settlement-castle-placement.js'
      - 'src/settlement-world.js'
      - 'qa/gate-roads-regression.cjs'
      - 'qa/cutaway-furniture-regression.cjs'
      - '.github/workflows/gate-six-sockets-regression.yml'
jobs:
  gate-cutaway:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Verify syntax
        run: |
          node --check src/settlement-castle-placement.js
          node --check qa/gate-roads-regression.cjs
          node --check qa/cutaway-furniture-regression.cjs
      - name: Test gate road and six subtower sockets
        run: node qa/gate-roads-regression.cjs
      - name: Test furnished cutaway
        run: node qa/cutaway-furniture-regression.cjs
