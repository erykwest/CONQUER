name: Sea and pier regression

on:
  push:
    branches:
      - mare
  pull_request:
    paths:
      - 'src/settlement-pier.js'
      - 'src/settlement-ships.js'
      - 'src/assets/ship-models.js'
      - 'src/heraldry-shapes.js'
      - 'src/settlement-ship-crew.js'
      - 'src/settlement-quay.js'
      - 'src/settlement-fleet.js'
      - 'src/settlement-naval-battle.js'
      - 'src/settlement-world.js'
      - 'src/settlement-hydrology.js'
      - 'qa/hydrology-network-regression.cjs'
      - 'qa/pier-regression.cjs'
      - 'qa/biome-recipes-regression.cjs'
      - 'qa/mountain-density-regression.cjs'
      - 'qa/regional-mountain-placement-regression.cjs'
      - 'src/settlement-regional-landscape.js'
      - 'src/regional-biome-rules.js'
      - 'qa/regional-surroundings-regression.cjs'
  workflow_dispatch:

jobs:
  sea-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Check JS syntax
        run: |
          for file in src/*.js qa/*.cjs; do node --check "$file"; done
      - name: Run sea coverage and pier regressions
        run: |
          node qa/biome-recipes-regression.cjs
          node qa/mountain-density-regression.cjs
          node qa/regional-mountain-placement-regression.cjs
          node qa/regional-surroundings-regression.cjs
          node qa/regional-demo-regression.cjs
          node qa/hydrology-network-regression.cjs
          node qa/pier-regression.cjs
          node qa/ships-regression.cjs
          node qa/ship-crew-regression.cjs
          node qa/naval-battle-regression.cjs
