name: Wardrobe regression

# Abort superseded PR runs of this workflow (never cancel scheduled/main runs).
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
on:
  pull_request:
    branches: [main]
    paths:
      - 'src/settlement-wardrobe.js'
      - 'src/settlement-staff-people.js'
      - 'src/settlement-civic3d.js'
      - 'src/settlement-forestry.js'
      - 'src/settlement-population-garrisons.js'
      - 'src/settlement-population-figures.js'
      - 'src/settlement-work-anim.js'
      - 'src/settlement-shop-cutaway.js'
      - 'src/settlement-industries.js'
      - 'src/settlement-shipyard.js'
      - 'src/settlement-ship-crew.js'
      - 'src/settlement-vehicles.js'
      - 'src/settlement-court-people.js'
      - 'qa/wardrobe-regression.cjs'
      - 'qa/staff-people-regression.cjs'
      - '.github/workflows/wardrobe-regression.yml'
  workflow_dispatch:
jobs:
  wardrobe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Check wardrobe source and test syntax
        run: |
          node --check src/settlement-wardrobe.js
          node --check src/settlement-population-figures.js
          node --check qa/wardrobe-regression.cjs
          node --check src/settlement-staff-people.js
          node --check qa/staff-people-regression.cjs
      - name: Run wardrobe regression
        run: node qa/wardrobe-regression.cjs
      - name: Run staff people regression (castle household, civic interiors, clearings)
        run: node qa/staff-people-regression.cjs
