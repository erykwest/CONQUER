name: Builder menu regression

# Abort superseded PR runs of this workflow (never cancel scheduled/main runs).
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/settlement.css'
      - 'src/settlement-builder-ux.js'
      - 'index.html'
      - 'qa/builder-menu-regression.cjs'
      - 'qa/builder-icons-browser.mjs'
      - 'src/assets/builder-icons/**'
      - '.github/workflows/builder-menu-regression.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  menu-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Check affected scripts
        run: |
          node --check src/settlement-builder-ux.js
          node --check qa/builder-menu-regression.cjs
      - name: Verify DEV scrolling and mill tool registration
        run: node qa/builder-menu-regression.cjs
      - name: Check existing mill models and placements
        run: |
          node qa/mills3d-regression.cjs
          node qa/builder-placement-regression.cjs
          node qa/lean-to-regression.cjs

  builder-icons-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - uses: ./.github/actions/playwright-setup
      - name: Start local Builder
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/builder-icons-http.log 2>&1 &
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:4173/index.html >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/builder-icons-http.log
          exit 1
      - name: Verify icon coverage, original handlers, Asset Lab and mobile
        run: node qa/builder-icons-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: builder-icons-browser
          path: output/playwright/buildericon/
