name: One-shot cleanup of merged branches (2026-11-17)
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/prune-merged-branches-20261117.yml
permissions:
  contents: write
  pull-requests: read
jobs:
  prune:
    if: "github.event.head_commit.message == 'chore: prune verified merged branches 2026-11-17'"
    runs-on: ubuntu-24.04
    steps:
      - name: Delete only reviewed merged branch refs
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          deleted=0
          skipped=0
          while IFS='|' read -r branch expected pr; do
            actual="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/${branch}" --jq '.object.sha' 2>/dev/null || true)"
            if [[ "$actual" != "$expected" ]]; then
              echo "SKIP ${branch}: head moved or missing"
              skipped=$((skipped+1))
              continue
            fi
            merged="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${pr}" --jq '.merged')"
            prhead="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${pr}" --jq '.head.sha')"
            base="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${pr}" --jq '.base.ref')"
            if [[ "$merged" != "true" || "$prhead" != "$expected" || "$base" != "main" ]]; then
              echo "SKIP ${branch}: PR not verified"
              skipped=$((skipped+1))
              continue
            fi
            gh api -X DELETE "repos/${GITHUB_REPOSITORY}/git/refs/heads/${branch}" --silent
            echo "DELETED ${branch} (PR #${pr})"
            deleted=$((deleted+1))
          done <<'MERGED_BRANCHES'
          combat-ai|3bd217def2b264ee520dc0dc15d9fa79d701a7a0|258
          docs/foot-messenger-after-lobby-20261115|f89cc155f2961887739516be2701ecb211dd6cf7|242
