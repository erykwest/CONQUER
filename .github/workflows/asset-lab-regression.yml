name: Asset Lab regression

# Abort superseded PR runs of this workflow (never cancel scheduled/main runs).
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
on:
  pull_request:
    paths:
      - figures-lab.html
      - src/asset-catalog.js
      - src/asset-manifest.js
      - src/assets/**
      - tools/build-asset-manifest.cjs
      - src/settlement-siege-preview.js
      - src/settlement-castle3d.js
      - src/settlement-world3d.js
      - src/settlement-storage-yard.js
      - .github/actions/playwright-setup/action.yml
      - src/settlement-app-persistence.js
      - src/settlement-work-anim.js
      - src/settlement-asset-stage.js
      - src/asset-audit.js
      - src/settlement-app-simulation.js
      - src/settlement-siege.js
      - src/settlement-castle*.js
      - lab/**
      - qa/asset-catalog-regression.cjs
      - qa/asset-catalog-browser.mjs
      - qa/asset-audit.mjs
      - qa/asset-audit-scope.cjs
      - qa/asset-audit-scope-regression.cjs
      - qa/asset-audit-baseline.json
      - index.html
      - .github/workflows/asset-lab-regression.yml
  workflow_dispatch:
  schedule:
    - cron: '47 4 * * 0'

permissions:
  contents: read

jobs:
  asset-lab:
    runs-on: ubuntu-latest
    outputs:
      visual_needed: ${{ steps.scope.outputs.visual_needed }}
      audit_mode: ${{ steps.scope.outputs.audit_mode }}
      audit_sources: ${{ steps.scope.outputs.audit_sources }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Select full, incremental or skipped visual audit
        id: scope
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          # Weekly and manual audits always test the entire catalogue.
          if [[ "$EVENT_NAME" != "pull_request" ]]; then
            {
              echo 'visual_needed=true'
              echo 'audit_mode=full'
              echo 'audit_sources='
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Fail safe: do a full audit if we cannot trust the diff.
          if [[ ! "$PR_BASE" =~ ^[a-f0-9]{40}$ || ! "$PR_HEAD" =~ ^[a-f0-9]{40}$ ]] ||
             ! git diff --name-status --diff-filter=ACDMRT "$PR_BASE...$PR_HEAD" > "$RUNNER_TEMP/assetlab-changes.txt"; then
            {
              echo 'visual_needed=true'
              echo 'audit_mode=full'
              echo 'audit_sources='
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi
          node qa/asset-audit-scope.cjs --diff "$RUNNER_TEMP/assetlab-changes.txt" --github-output "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - run: node --check src/asset-catalog.js
      - run: node --check src/asset-manifest.js
      - run: node --check src/settlement-siege-preview.js
      - run: node --check src/settlement-asset-stage.js
      - run: node --check src/asset-audit.js
      - name: Asset manifest is up to date
        run: node tools/build-asset-manifest.cjs --check
      - run: node qa/asset-catalog-regression.cjs
      - run: node qa/asset-audit-scope-regression.cjs
  browser:
    needs: asset-lab
    if: needs.asset-lab.outputs.visual_needed == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Start local Asset Lab
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/asset-lab-http.log 2>&1 &
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:4173/figures-lab.html >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/asset-lab-http.log
          exit 1
      - name: Install cached Chromium and pinned Playwright
        uses: ./.github/actions/playwright-setup
      - name: Run gallery browser QA
        run: node qa/asset-catalog-browser.mjs
      - name: Visual audit (incremental or complete)
        env:
          AUDIT_MODE: ${{ needs.asset-lab.outputs.audit_mode }}
          AUDIT_SOURCES: ${{ needs.asset-lab.outputs.audit_sources }}
        shell: bash
        run: |
          if [[ "$AUDIT_MODE" == "incremental" && -n "$AUDIT_SOURCES" ]]; then
            node qa/asset-audit.mjs --sources="$AUDIT_SOURCES"
          else
            node qa/asset-audit.mjs
          fi
      - name: Audit summary
        if: always()
        run: test -f artifacts/asset-audit/report.md && cat artifacts/asset-audit/report.md >> "$GITHUB_STEP_SUMMARY" || true
      - name: Save visual diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: asset-lab-visual-qa
          path: |
            artifacts/asset-lab-browser.png
            artifacts/asset-audit/
          retention-days: 14
