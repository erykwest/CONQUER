name: Events regression

on:
  push:
    branches:
      - events
  workflow_dispatch:

jobs:
  events-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JS syntax
        run: |
          for file in src/*.js qa/*.cjs; do node --check "$file"; done
      - name: Run event venue and civic 3D regressions
        run: |
          node qa/events3d-regression.cjs
          node qa/civic3d-regression.cjs
