name: Sound source media optimization

on:
  push:
    branches: [sound]
    paths:
      - scripts/optimize-sounds.py
      - .github/workflows/sound-optimize.yml

permissions:
  contents: write

jobs:
  optimize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install FFmpeg encoder and probe
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          command -v ffmpeg
          command -v ffprobe
      - name: Optimize selected high-bitrate recordings and recalibrate LUFS
        run: python3 scripts/optimize-sounds.py
      - name: Sound QA with processed media
        run: node qa/sound-regression.cjs
      - name: Commit derived media to sound only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/assets/sounds src/settlement-sound-catalog.js docs/sound-compression-report.json
          if ! git diff --cached --quiet; then
            git commit -m "Sound: encode selected 256 kbps recordings and refresh loudness trims"
            git push origin HEAD:sound
          fi
