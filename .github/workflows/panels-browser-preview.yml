name: Settlement panels browser preview

# Abort superseded PR runs of this workflow (never cancel scheduled/main runs).
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
on:
  pull_request:
    paths:
      - 'src/settlement-panels.js'
      - 'src/settlement-panels.css'
      - 'src/settlement-economy.js'
      - 'src/settlement-heraldry.js'
      - 'qa/panels-browser.mjs'
      - 'qa/panels-regression.cjs'
      - 'qa/economy-panel-history-regression.cjs'
      - 'index.html'
      - '.github/workflows/panels-browser-preview.yml'
      - '.github/actions/playwright-setup/action.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  preview:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate management history and views
        run: |
          node --check qa/panels-browser.mjs
          # Contracts are already checked by Economy flows on this PR.
      - name: Start game locally
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/conquer-panels-http.log 2>&1 &
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:4173/index.html >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/conquer-panels-http.log
          exit 1
      - name: Install cached Chromium and pinned Playwright
        uses: ./.github/actions/playwright-setup
      - name: Capture management panels with browser
        run: node qa/panels-browser.mjs
      - name: Verify construction inspectors and save/refund flows
        run: |
          node qa/construction-browser.mjs
          node qa/upgrades-dev-browser.mjs
      - name: Upload construction screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: construction-ui-screenshots
          path: |
            output/playwright/construction/
            output/playwright/upgrades-dev/
          retention-days: 21
      - name: Upload six screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: panels-ui-screenshots
          path: artifacts/panels-preview/
          retention-days: 21
