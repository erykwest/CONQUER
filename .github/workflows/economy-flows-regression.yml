name: Economy flows regression
on:
  push:
    branches:
      - feature/economic-balances-20261019
      - economic-balances-animations
  pull_request:
    paths:
      - 'src/settlement-economy.js'
      - 'qa/economy*.cjs'
      - 'qa/construction*.cjs'
      - 'src/settlement-core.js'
      - 'src/settlement-commerce.js'
      - 'src/settlement-convoys.js'
      - 'src/settlement-road-sign-tests.js'
      - 'src/assets/road-sign-model.js'
      - 'src/settlement-wagons.js'
      - 'src/settlement-vehicles.js'
      - 'src/settlement-wagons3d.js'
      - 'src/settlement-animals3d.js'
      - 'qa/vehicles*.cjs'
      - 'qa/road-sign*.cjs'
      - 'qa/convoys*.cjs'
      - 'src/settlement-population-residents.js'
      - 'src/settlement-population-routines.js'
      - 'src/settlement-app-rooms.js'
      - 'qa/commerce*.cjs'
      - '.github/workflows/economy-flows-regression.yml'
  workflow_dispatch:
jobs:
  economic-ledger:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Economy and construction-worker regressions
        run: |
          node qa/economy-regression.cjs
          node qa/commerce-skeleton-regression.cjs
          node qa/convoys-skeleton-regression.cjs
          node qa/road-sign-convoy-regression.cjs
          node qa/vehicles-regression.cjs
          node qa/wagons3d-regression.cjs
          node qa/animals3d-regression.cjs
          node --check src/settlement-vehicles.js
          node qa/settlement-routing-spawn-regression.cjs
          node --check src/settlement-commerce.js
          node --check src/settlement-convoys.js
          node --check src/settlement-road-sign-tests.js
          node --check src/settlement-wagons.js
          node --check src/assets/road-sign-model.js
          node --check src/settlement-population-routines.js
          node --check src/settlement-population-residents.js
          node --check src/settlement-app-rooms.js
          node qa/economy-industries-regression.cjs
          node qa/economy-balance-regression.cjs
          node qa/economy-builder-integration.cjs
          node qa/construction-workers-regression.cjs
          node qa/construction-payroll-regression.cjs
          node qa/construction-commute-regression.cjs
          node qa/founding-regression.cjs
          node qa/builder-placement-regression.cjs
          node qa/refactor-app-population-regression.cjs
