name: Economy flows regression
on:
  pull_request:
    paths:
      - 'src/settlement-economy.js'
      - 'src/settlement-population-figures.js'
      - 'src/ui/**'
      - 'qa/labor*.cjs'
      - 'qa/economy*.cjs'
      - 'qa/construction*.cjs'
      - 'src/settlement-core.js'
      - 'src/settlement-population-*.js'
      - 'src/settlement-commerce.js'
      - 'src/settlement-urban-economy.js'
      - 'src/settlement-market-economy.js'
      - 'src/settlement-convoys.js'
      - 'src/settlement-diplomacy.js'
      - 'src/settlement-road-sign-tests.js'
      - 'src/settlement-vehicles.js'
      - 'src/settlement-wagons.js'
      - 'qa/*routines*.cjs'
      - 'qa/commerce*.cjs'
      - 'qa/urban-workshops*.cjs'
      - 'qa/convoys*.cjs'
      - 'qa/road-sign*.cjs'
      - 'qa/vehicles*.cjs'
      - '.github/workflows/economy-flows-regression.yml'
  workflow_dispatch:
jobs:
  economic-ledger:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Economy and construction-worker regressions
        run: |
          node qa/economy-regression.cjs
          node qa/economy-industries-regression.cjs
          node qa/economy-balance-regression.cjs
          node qa/economy-builder-integration.cjs
          node qa/construction-workers-regression.cjs
          node qa/construction-payroll-regression.cjs
          node qa/construction-commute-regression.cjs
          node qa/labor-jobs-regression.cjs
          node qa/economy-rations-regression.cjs
          node qa/save-safety-regression.cjs
          node qa/founding-regression.cjs
          node qa/builder-placement-regression.cjs
          node qa/refactor-app-population-regression.cjs
      - name: Routines, commerce, convoys and vehicles regressions
        run: |
          node qa/male-routines-regression.cjs
          node qa/female-routines-regression.cjs
          node qa/commerce-skeleton-regression.cjs
          node qa/urban-workshops-regression.cjs
          node qa/convoys-skeleton-regression.cjs
          node qa/road-sign-convoy-regression.cjs
          node qa/diplomacy-regression.cjs
          node qa/vehicles-regression.cjs
