name: 'CONQUER cached Chromium'
description: 'Use one Playwright version and a shared Chromium/npm cache on Ubuntu 24.04'
runs:
  using: 'composite'
  steps:
    - name: Restore Playwright and Chromium downloads
      uses: actions/cache@v4
      with:
        path: |
          ~/.cache/ms-playwright
          ~/.npm
        key: conquer-chromium-${{ runner.os }}-${{ runner.arch }}-playwright-1.56.1-v1
    - name: Install pinned Playwright
      shell: bash
      run: npm install --no-save --no-package-lock playwright@1.56.1
    - name: Ensure Chromium and system libraries
      shell: bash
      run: npx playwright install --with-deps chromium
